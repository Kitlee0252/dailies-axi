<!doctype html>
<html lang="en" data-lavish-annotate="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Signal · Frame review</title>
  <style>
    * { box-sizing: border-box }
    :root { color-scheme: dark; font: 16px system-ui; color: #f1edff; background: #11111b; --muted: #beb7d0; --mint: #b8f3d8; --line: #413a53 }
    body { margin: 0 }
    main { max-width: 1024px; margin: auto; padding: 24px }
    h1 { margin: 2px 0 6px; font-size: clamp(1.65rem, 4vw, 2.45rem) }
    h2 { font-size: 1.15rem }
    p { color: var(--muted); margin: 0 0 14px }
    .eyebrow { color: var(--mint); font-size: .73rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase }
    #canvas { width: min(100%, 104vh); margin: 0 auto; position: relative; aspect-ratio: 16 / 9; isolation: isolate; background: #19172c; outline: 1px solid var(--line); border-radius: 8px; overflow: hidden }
    #composition { position: absolute; inset: 0; transform-origin: top left; border: 0; pointer-events: none }
    #surface, #markers { position: absolute; inset: 0 }
    #surface { cursor: crosshair; touch-action: none }
    #markers { pointer-events: none }
    .region { position: absolute; border: 2px solid var(--mint); background: #b8f3d822 }
    .region b { position: absolute; left: 0; top: 0; background: var(--mint); color: #131824; font: bold 12px system-ui; padding: 1px 5px }
    #composer { position: absolute; z-index: 1; width: min(330px, calc(100% - 16px)); padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #211d30; box-shadow: 0 8px 32px #0009 }
    #stage { position: relative }
    button, textarea, input { font: inherit }
    button { border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; background: #262236; color: inherit; cursor: pointer }
    button.primary { background: var(--mint); color: #131824; font-weight: 700 }
    button:disabled { opacity: .5; cursor: default }
    :focus-visible { outline: 2px solid #c4adff; outline-offset: 2px }
    textarea { display: block; resize: vertical; width: 100%; min-height: 66px; margin: 7px 0; padding: 6px; background: #141222; color: inherit; border: 1px solid var(--line); border-radius: 4px }
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px }
    .transport { margin: 12px 0; padding-bottom: 12px; border-bottom: 1px solid var(--line) }
    #seek { flex: 1; min-width: 100px; accent-color: var(--mint) }
    output { font-variant-numeric: tabular-nums; min-width: 126px; font-size: .86rem }
    #targets { margin: 5px 0; font-size: .82rem }
    #notes { padding-left: 26px }
    #notes li { margin: 6px 0; border-bottom: 1px solid var(--line); padding: 5px 0; overflow-wrap: anywhere }
    #notes li p { white-space: pre-wrap; margin: 6px 0 }
    #status { margin: 8px 0; min-height: 1.5em }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Northstar / Frame review / <span id="version"></span></div>
  <h1>Point to what should change</h1>
  <p>Scrub or play, then click for a small box or drag around any part of the frame.</p>
  <div id="stage">
    <div id="canvas">
      <iframe id="composition" title="Live HyperFrames composition" sandbox="allow-scripts" tabindex="-1"></iframe>
      <div id="markers" aria-hidden="true"></div>
      <div id="surface" data-lavish-action></div>
    </div>
    <form id="composer" hidden>
      <label for="feedback">What should change here?</label>
      <p id="targets"></p>
      <textarea id="feedback" required maxlength="1000" placeholder="Describe the change you want…"></textarea>
      <div class="row"><button class="primary" type="submit">Add note</button><button id="cancel" type="button">Cancel</button></div>
    </form>
  </div>
  <div class="row transport">
    <button id="play" disabled>Play</button>
    <button id="previous" aria-label="Previous frame" disabled>−1</button>
    <button id="next" aria-label="Next frame" disabled>+1</button>
    <input id="seek" type="range" min="0" max="0" value="0" aria-label="Frame" disabled>
    <output id="time" for="seek"></output>
  </div>
  <h2>Notes <span id="count"></span></h2>
  <p id="empty">No notes yet. Select a region to add one.</p>
  <ol id="notes"></ol>
  <button id="send" class="primary" disabled>Send feedback to agent</button>
  <p id="status" role="status">Loading live composition…</p>
</main>
<!-- REVIEW_SCRIPT -->
</body>
</html>
