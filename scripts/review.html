<!doctype html><html lang="en" data-lavish-annotate="off"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video review</title><style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#eff4f6;font:16px system-ui}main{max-width:950px;margin:auto;padding:24px}h1{margin-bottom:4px}p{color:#acbec7}video{width:100%;background:#000;max-height:55vh}button,textarea{font:inherit}button{background:#d4edeb;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}button.secondary{background:#33434c;color:white}textarea{width:100%;min-height:90px;margin:12px 0;background:#1f2c34;color:white;border:1px solid #6b818b;border-radius:6px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}li{padding:10px;border-bottom:1px solid #43535c;overflow-wrap:anywhere}li button{float:right}#status{min-height:1.5em;color:#a8dbcf}
</style></head><body><main><h1>Video review · <span id="version"></span></h1><p>Watch, mark a moment or range, and add a note. Times refer to this version.</p><video id="video" controls preload="metadata" src="__VIDEO__"></video><div class="actions"><button id="point">Mark current time</button><button class="secondary" id="start">Mark range start</button><button class="secondary" id="end">Mark range end</button></div><div id="mark">No time marked</div><label for="text">Feedback</label><textarea id="text" placeholder="What should change?"></textarea><div class="actions"><button id="add">Add note</button></div><h2>Notes</h2><ol id="notes"></ol><button id="send">Send feedback to agent</button><p id="status" role="status"></p></main><script>
const map=__MAP__, version=map.version, video=document.querySelector('#video'), notes=[]; let mark=null, rangeStart=null;
document.querySelector('#version').textContent=version;
const $=s=>document.querySelector(s), fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toFixed(1).padStart(4,'0')}`;
function locate(t){let s=map.segments.find(x=>t>=x.output_start && t<x.output_end) || (t===map.segments.at(-1).output_end?map.segments.at(-1):null);return s?{segment_id:s.id,source_time:+(s.source_start+t-s.output_start).toFixed(3)}:null}
function update(){ $('#mark').textContent=mark ? (mark.time!==undefined?`Point ${fmt(mark.time)}`:`Range ${fmt(mark.start)} – ${fmt(mark.end)}`) : rangeStart!==null?`Range starts ${fmt(rangeStart)}; mark the end.`:'No time marked'; }
$('#point').onclick=()=>{mark={time:video.currentTime};rangeStart=null;update()};
$('#start').onclick=()=>{rangeStart=video.currentTime;mark=null;update()};
$('#end').onclick=()=>{if(rangeStart===null || video.currentTime<=rangeStart){$('#status').textContent='Mark a start, then an end later than the start.';return}mark={start:rangeStart,end:video.currentTime};rangeStart=null;update()};
function render(){const list=$('#notes');list.replaceChildren();notes.forEach((n,i)=>{const li=document.createElement('li'), del=document.createElement('button');del.textContent='Delete';del.className='secondary';del.onclick=()=>{notes.splice(i,1);render()};li.append(del,document.createTextNode((n.time!==undefined?fmt(n.time):`${fmt(n.start)} – ${fmt(n.end)}`)+` · ${n.text}`));list.append(li)})}
$('#add').onclick=()=>{let text=$('#text').value.trim();if(!mark||!text){$('#status').textContent='Mark a time and enter feedback first.';return}let n={...mark,text};if(n.time!==undefined)Object.assign(n,locate(n.time)||{});else {n.start_location=locate(n.start);n.end_location=locate(n.end);n.segment_ids=map.segments.filter(s=>s.output_start<n.end && s.output_end>n.start).map(s=>s.id)}notes.push(n);mark=null;$('#text').value='';$('#status').textContent='Note added locally.';update();render()};
$('#send').onclick=()=>{if(!notes.length){$('#status').textContent='Add at least one note.';return}if(!window.lavish?.queuePrompt){$('#status').textContent='Open this page with lavish-axi to send.';return}window.lavish.queuePrompt('Apply the video review feedback for '+version,{tag:'video-review',text:`${notes.length} video review note(s) for ${version}`,data:{version,notes:structuredClone(notes)},queueKey:'video-review-'+version});window.lavish.sendQueuedPrompts();$('#status').textContent='Feedback sent to Lavish.'};
</script></body></html>
