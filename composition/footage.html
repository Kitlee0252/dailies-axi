<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Footage review</title>
  <style>
    body { margin: 0 }
    #film { position: relative; overflow: hidden; width: 720px; height: 1280px; background: #181818 }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain }
  </style>
</head>
<body>
  <!-- Use ingest's dimensions, fps and duration. Reuse the proxy across cuts and give each segment a stable ID. -->
  <div id="film" data-composition-id="footage" data-start="0" data-duration="10" data-width="720" data-height="1280" data-fps="30">
    <video id="shot-a" class="clip" data-review-clip="camera" src="media/camera.mp4"
      data-start="0" data-duration="10" data-media-start="0" data-track-index="0" data-has-audio="true" playsinline preload="auto"></video>
  </div>
  <script src="gsap.min.js"></script>
  <script>
    const timeline = gsap.timeline({ paused: true });
    timeline.to({}, { duration: Number(document.querySelector('#film').dataset.duration) });
    window.__timelines = { footage: timeline };
  </script>
</body>
</html>
